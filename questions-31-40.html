<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-103 Practice Questions 31-40</title><style>:root{--bg:#07111f;--panel:#0d1b2c;--panel2:#14283e;--line:#28445f;--text:#eef6ff;--muted:#a7b8cb;--blue:#2ea7ff;--green:#3ddc97;--red:#ff6b7d;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0b1d33);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h1{margin:0;font-size:1.7rem}.hero p{color:var(--muted)}.badge{padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.card{background:rgba(13,27,44,.97);border:1px solid var(--line);border-radius:20px;padding:22px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:20px}.progress{height:10px;background:#06101c;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ea7ff,#7bd3ff)}.stat{background:var(--panel2);padding:9px 12px;border-radius:10px;color:var(--muted)}.qmeta{color:var(--blue);font-weight:800;margin-bottom:10px}.question{font-size:1.16rem;line-height:1.55;white-space:pre-line}.option{display:flex;gap:12px;width:100%;text-align:left;background:#0a192a;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer}.option.selected{background:#10304f;border-color:var(--blue)}.option.correct{background:#113a2d;border-color:var(--green)}.option.wrong{background:#44202a;border-color:var(--red)}.letter{display:grid;place-items:center;min-width:29px;height:29px;border-radius:50%;background:#193650;font-weight:800}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#001522}.secondary{background:#1b3551;color:var(--text)}.success{background:#184232;color:#d9ffed}.danger{background:#4b202b;color:#ffe4e8}.hidden{display:none!important}.feedback{margin-top:18px;padding:16px;border-radius:14px;background:#091827;border:1px solid var(--line)}.good{color:var(--green)}.bad{color:var(--red)}.explain{color:#d4e0eb;line-height:1.58}.takeaway,.concept{margin-top:12px;padding:12px;background:#10253a;border-radius:10px;color:#bfe4ff}.concept{background:#182b3f;color:#d8e8f6}.start,.result{text-align:center}.score{font-size:4rem;color:var(--blue);font-weight:900}.review-card{background:#091827;border:1px solid var(--line);border-radius:15px;padding:17px;margin:13px 0}.select-row{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center;margin:12px 0}.select-row select{width:100%;padding:11px;border-radius:10px;background:#0a192a;color:var(--text);border:1px solid var(--line)}@media(max-width:700px){.wrap{padding:12px}.hero{flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.progress{grid-column:1/-1}.select-row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><div><h1>AI-103 Practice Exam</h1><p>Questions 31–40 from your PDF, with enriched explanations.</p></div><div class="badge">Questions 31–40</div></div><section id="start" class="card start"><h2>Continue your revision</h2><p>Answer each question, check it, and study the explanation before moving on.</p><button class="primary" onclick="startExam()">Start</button></section><section id="exam" class="card hidden"><div class="toolbar"><div class="progress"><span id="bar"></span></div><div id="answered" class="stat"></div><div id="scoreLive" class="stat"></div></div><div id="qmeta" class="qmeta"></div><div id="question" class="question"></div><div id="answers"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prevBtn" class="secondary" onclick="move(-1)">Previous</button><div><button id="checkBtn" class="success" onclick="checkAnswer()">Check answer</button><button id="nextBtn" class="primary" onclick="move(1)">Next</button><button id="finishBtn" class="danger hidden" onclick="finishExam()">Finish</button></div></div></section><section id="result" class="card result hidden"><h2>Practice completed</h2><div id="finalScore" class="score"></div><p id="grade"></p><div class="actions" style="justify-content:center"><button class="primary" onclick="showReview(false)">Full review</button><button class="secondary" onclick="showReview(true)">Review mistakes</button><button class="secondary" onclick="restart()">Restart</button></div></section><section id="review" class="card hidden"><div class="actions"><h2>Detailed review</h2><button class="secondary" onclick="backToResult()">Back</button></div><div id="reviewList"></div></section></div><script>const questions=[{id:31,type:'single',topic:'Foundry Connections',question:`Project1 contains multiple agents that all access the same Azure AI Search resource. You need to centrally manage the Azure AI Search credentials inside Project1 and reuse the configuration across all agents. What should you recommend?`,options:[`Enable RBAC for the Azure AI Search resource.`,`Disable key-based access on the Azure AI Search resource.`,`Add a connection to the Azure AI Search resource.`,`Create a managed private endpoint to Azure AI Search.`],answer:2,explanation:`A Foundry project connection centralizes the Search endpoint and authentication configuration. Every agent in the project can reference the same connection, avoiding duplicated credentials and inconsistent settings.`,wrong:[`RBAC controls authorization but does not create a reusable Foundry configuration.`,`Disabling keys changes the authentication policy but does not centralize configuration.`,`A managed private endpoint provides private network connectivity, not credential management.`],concept:`Connection, authorization, and networking solve different problems. Foundry connections solve reusable resource configuration.`,takeaway:`Centrally reuse Search settings across agents = add a project connection.`},{id:32,type:'single',topic:'Image Safety',question:`A support agent allows users to upload photos. You must automatically classify harmful visual content and block images based on severity levels. What should you do?`,options:[`Scan OCR text for keywords by using Azure Vision.`,`Enable Prompt Shields.`,`Use custom blocklists.`,`Implement image moderation.`],answer:3,explanation:`Image moderation analyzes the visual content itself, assigns categories and severity levels, and supports policy-based blocking.`,wrong:[`OCR keyword scanning only examines visible text and misses harmful visual material.`,`Prompt Shields target prompt-injection attacks, not general harmful imagery.`,`Blocklists filter known words or phrases and do not classify visual content.`],concept:`Image safety and prompt-injection protection are separate controls. Image moderation evaluates what is depicted; Prompt Shields evaluate malicious instructions.`,takeaway:`Harmful uploaded images + severity thresholds = image moderation.`},{id:33,type:'mapping',topic:'Human in the Loop',question:`A refund workflow must pause for human approval and execute the refund only after approval is granted. Complete the workflow configuration.`,rows:[{label:`Approval step type`,options:[`basic_chat`,`ask_question`,`data_transformation`],answer:`ask_question`},{label:`Refund execution condition`,options:[`propose_refund.output != null`,`true`,`approval == "approved"`],answer:`approval == "approved"`}],explanation:`ask_question pauses the workflow and waits for human input. The refund step must be guarded by an explicit approval condition rather than by the mere presence of an output.`,concept:`Human-in-the-loop controls require both a pause for approval and a conditional gate on the consequential action.`,takeaway:`Pause for human input = ask_question; execute only when approval == approved.`},{id:34,type:'single',topic:'RAG Evaluation',question:`After an Azure AI Search content update, an agent's answers become less accurate. You need to determine whether retrieved content is negatively influencing generated responses. Which signal should you review?`,options:[`Indexer status and failure history`,`Latency breakdown traces`,`Prediction drift metrics`,`Groundedness evaluation metrics`],answer:3,explanation:`Groundedness evaluation checks whether generated claims are supported by the retrieved documents. It is the direct signal for determining whether retrieval context is producing unsupported or misleading answers.`,wrong:[`Indexer status confirms ingestion success but not response support.`,`Latency traces explain performance, not answer quality.`,`Prediction drift is not the primary RAG support metric.`],concept:`RAG quality must be evaluated at the relationship between retrieved evidence and generated answer.`,takeaway:`Is the answer supported by retrieved content? Review groundedness.`},{id:35,type:'single',topic:'RAG Completeness',question:`A legal RAG agent omits important clauses from lengthy documents. You must improve response completeness in application logic without changing the index or model. What should you do?`,options:[`Increase the number of retrieved document chunks before constructing the prompt.`,`Enable Prompt Shields for document attacks.`,`Configure Content Safety to annotate responses.`,`Lower the temperature.`],answer:0,explanation:`Retrieving more relevant chunks gives the model a broader evidence set and increases the chance that all applicable clauses are present in the prompt context.`,wrong:[`Prompt Shields address malicious instructions, not missing evidence.`,`Content Safety addresses harmful content, not completeness.`,`Lower temperature reduces randomness but cannot recover clauses that were never retrieved.`],concept:`Generation cannot use evidence that retrieval did not provide. When relevant content is missing, improve retrieval coverage first.`,takeaway:`Missing clauses with unchanged index/model = retrieve more relevant chunks.`},{id:36,type:'mapping',topic:'Content Understanding Modes',question:`Configure two Azure Content Understanding pipelines. Pipeline1 must process standalone invoices cost-effectively at high volume. Pipeline2 must perform cross-document validation with multi-step reasoning and reference data.`,rows:[{label:`Pipeline1`,options:[`Single-file task in standard mode`,`Single-file task in pro mode`,`Multi-file task in standard mode`,`Multi-file task in pro mode`],answer:`Single-file task in standard mode`},{label:`Pipeline2`,options:[`Single-file task in standard mode`,`Single-file task in pro mode`,`Multi-file task in standard mode`,`Multi-file task in pro mode`],answer:`Multi-file task in pro mode`}],explanation:`Standard mode is appropriate for straightforward, economical extraction of independent documents. Pro mode supports advanced reasoning, and a multi-file task is required to compare and validate information across documents.`,concept:`Choose task scope by the number of related documents and choose mode by reasoning complexity.`,takeaway:`Independent high-volume files = single-file standard; cross-document reasoning = multi-file pro.`},{id:37,type:'single',topic:'Prompt Injection',question:`A multimodal model accepts images containing hidden malicious instructions. Solution: Configure Prompt Shields for user prompts. Does this meet the goal?`,options:[`Yes`,`No`],answer:1,explanation:`No. The malicious instruction is embedded in external image content, so it is an indirect prompt-injection or document attack. User-prompt shields target direct attacks in the user's prompt.`,wrong:[`Selecting Yes confuses direct user-prompt attacks with indirect attacks embedded in documents or images.`],concept:`Attack origin determines the control: direct text in the user prompt versus indirect instructions inside external content.`,takeaway:`Hidden instructions in images = Prompt Shields for documents, not only user prompts.`},{id:38,type:'single',topic:'Image Moderation vs Prompt Shields',question:`A multimodal model accepts images containing hidden malicious instructions. Solution: Configure image moderation to block unsafe content before processing. Does this fully meet the prompt-injection goal?`,options:[`Yes`,`No`],answer:1,explanation:`No. Image moderation detects harmful visual categories, but it does not specifically detect instructions embedded in image text that attempt to manipulate the model.`,wrong:[`Selecting Yes treats all image safety controls as equivalent. Image moderation and document Prompt Shields protect against different risks.`],concept:`An image can be visually safe yet still contain malicious text. Defense must match the threat.`,takeaway:`Unsafe visuals = image moderation; embedded malicious instructions = document Prompt Shields.`},{id:39,type:'single',topic:'Document Prompt Shields',question:`A multimodal model accepts images containing hidden malicious instructions. Solution: Configure Prompt Shields for documents. Does this meet the goal?`,options:[`Yes`,`No`],answer:0,explanation:`Yes. Document Prompt Shields analyze external document and image content for indirect prompt-injection attempts before that content can influence the model.`,wrong:[`Selecting No ignores that images and extracted image text are treated as external document content for this protection.`],concept:`Document attacks include malicious instructions embedded in retrieved pages, uploaded documents, screenshots, and images.`,takeaway:`Indirect injection from uploaded content = Prompt Shields for documents.`},{id:40,type:'single',topic:'Protected Material',question:`A multimodal model accepts images containing hidden malicious instructions. Solution: Configure protected material detection. Does this meet the prompt-injection goal?`,options:[`Yes`,`No`],answer:1,explanation:`No. Protected material detection focuses on copyrighted or protected text and code. It does not detect attempts to override model instructions.`,wrong:[`Selecting Yes confuses copyright protection with security against prompt manipulation.`],concept:`Responsible AI controls are specialized: copyright detection, harmful-content moderation, and prompt-injection defense are not interchangeable.`,takeaway:`Protected material detection is not a prompt-injection control.`}];let current=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false),score=0;const total=questions.length;function startExam(){start.classList.add('hidden');exam.classList.remove('hidden');render()}function render(){const q=questions[current];qmeta.textContent=`Question ${q.id} · ${q.topic}`;question.textContent=q.question;feedback.classList.add('hidden');feedback.innerHTML='';const box=document.getElementById('answers');box.innerHTML='';if(q.type==='single'){q.options.forEach((o,i)=>{const b=document.createElement('button'),sel=answers[current]===i;b.className='option'+(sel?' selected':'');if(checked[current]){if(i===q.answer)b.classList.add('correct');else if(sel)b.classList.add('wrong')}b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span>`;b.onclick=()=>{if(!checked[current]){answers[current]=i;render()}};box.appendChild(b)})}else q.rows.forEach((r,ri)=>{const row=document.createElement('div');row.className='select-row';row.innerHTML=`<strong>${r.label}</strong><select onchange="setRow(${ri},this.value)" ${checked[current]?'disabled':''}><option value="">Select...</option>${r.options.map(v=>`<option value='${v.replace(/'/g,"&#39;")}' ${((answers[current]||[])[ri]||'')===v?'selected':''}>${v}</option>`).join('')}</select>`;box.appendChild(row)});if(checked[current])showFeedback();const done=checked.filter(Boolean).length;answered.textContent=`${done}/${total}`;scoreLive.textContent=`Score: ${score}`;bar.style.width=`${done/total*100}%`;prevBtn.disabled=current===0;nextBtn.classList.toggle('hidden',current===total-1);finishBtn.classList.toggle('hidden',current!==total-1);checkBtn.disabled=checked[current]}function setRow(i,v){let a=answers[current]||[];a[i]=v;answers[current]=a}function isCorrect(i){const q=questions[i],a=answers[i];if(q.type==='single')return a===q.answer;return Array.isArray(a)&&q.rows.every((r,j)=>a[j]===r.answer)}function hasAnswer(){const q=questions[current],a=answers[current];if(q.type==='single')return a!==null;return Array.isArray(a)&&a.length===q.rows.length&&a.every(Boolean)}function checkAnswer(){if(!hasAnswer()){alert('Please answer the question first.');return}checked[current]=true;if(isCorrect(current))score++;render()}function showFeedback(){const q=questions[current],ok=isCorrect(current);feedback.classList.remove('hidden');let wrong=q.wrong?`<h4>Why the other choices are wrong</h4><ul>${q.wrong.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';feedback.innerHTML=`<h3 class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</h3><p class="explain">${q.explanation}</p>${wrong}<div class="concept"><strong>Concept:</strong> ${q.concept}</div><div class="takeaway"><strong>Exam takeaway:</strong> ${q.takeaway}</div>`}function move(n){current=Math.max(0,Math.min(total-1,current+n));render();scrollTo({top:0,behavior:'smooth'})}function finishExam(){if(!checked[current]){alert('Check the current answer first.');return}exam.classList.add('hidden');result.classList.remove('hidden');const pct=Math.round(score/total*100);finalScore.textContent=`${pct}%`;grade.textContent=pct>=80?'Strong result.':pct>=60?'Review your mistakes.':'Study the explanations and retry.';localStorage.setItem('ai103-score-31-40',pct)}function showReview(onlyWrong){result.classList.add('hidden');review.classList.remove('hidden');reviewList.innerHTML='';questions.forEach((q,i)=>{const ok=isCorrect(i);if(onlyWrong&&ok)return;const d=document.createElement('div');d.className='review-card';let your=q.type==='single'?(answers[i]===null?'No answer':q.options[answers[i]]):((answers[i]||[]).join(' | ')||'No answer');let correct=q.type==='single'?q.options[q.answer]:q.rows.map(r=>`${r.label}: ${r.answer}`).join('<br>');d.innerHTML=`<h3>Q${q.id}. ${q.question}</h3><p class="${ok?'good':'bad'}"><strong>Your answer:</strong> ${your}</p><p class="good"><strong>Correct answer:</strong> ${correct}</p><p class="explain"><strong>Explanation:</strong> ${q.explanation}</p><div class="concept"><strong>Concept:</strong> ${q.concept}</div><div class="takeaway"><strong>Exam takeaway:</strong> ${q.takeaway}</div>`;reviewList.appendChild(d)})}function backToResult(){review.classList.add('hidden');result.classList.remove('hidden')}function restart(){current=0;answers=Array(total).fill(null);checked=Array(total).fill(false);score=0;result.classList.add('hidden');start.classList.remove('hidden')}</script></body></html>
