<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-103 Practice Exam</title><style>:root{--bg:#07111f;--panel:#0d1b2c;--panel2:#14283e;--line:#28445f;--text:#eef6ff;--muted:#a7b8cb;--blue:#2ea7ff;--green:#3ddc97;--red:#ff6b7d;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0b1d33);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h1{margin:0;font-size:1.7rem}.hero p{color:var(--muted)}.badge{padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.card{background:rgba(13,27,44,.97);border:1px solid var(--line);border-radius:20px;padding:22px}.notice{background:#2b2517;border-left:4px solid var(--amber);padding:12px 14px;border-radius:8px;color:#ffe9a8;margin-bottom:18px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:20px}.progress{height:10px;background:#06101c;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ea7ff,#7bd3ff)}.stat{background:var(--panel2);padding:9px 12px;border-radius:10px;color:var(--muted)}.qmeta{color:var(--blue);font-weight:800;margin-bottom:10px}.question{font-size:1.16rem;line-height:1.55;white-space:pre-line}.option{display:flex;gap:12px;width:100%;text-align:left;background:#0a192a;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer}.option.selected{background:#10304f;border-color:var(--blue)}.option.correct{background:#113a2d;border-color:var(--green)}.option.wrong{background:#44202a;border-color:var(--red)}.letter{display:grid;place-items:center;min-width:29px;height:29px;border-radius:50%;background:#193650;font-weight:800}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#001522}.secondary{background:#1b3551;color:var(--text)}.success{background:#184232;color:#d9ffed}.danger{background:#4b202b;color:#ffe4e8}.hidden{display:none!important}.feedback{margin-top:18px;padding:16px;border-radius:14px;background:#091827;border:1px solid var(--line)}.good{color:var(--green)}.bad{color:var(--red)}.explain{color:#d4e0eb;line-height:1.58}.takeaway,.concept{margin-top:12px;padding:12px;background:#10253a;border-radius:10px;color:#bfe4ff}.concept{background:#182b3f;color:#d8e8f6}.start,.result{text-align:center}.score{font-size:4rem;color:var(--blue);font-weight:900}.review-card{background:#091827;border:1px solid var(--line);border-radius:15px;padding:17px;margin:13px 0}.select-row{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center;margin:12px 0}.select-row select{width:100%;padding:11px;border-radius:10px;background:#0a192a;color:var(--text);border:1px solid var(--line)}@media(max-width:700px){.wrap{padding:12px}.hero{flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.progress{grid-column:1/-1}.select-row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><div><h1>AI-103 Practice Exam</h1><p>Questions 1–30 from the provided PDF, with enriched revision explanations.</p></div><div class="badge">30 questions</div></div><section id="start" class="card start"><div class="notice">Study mode: answer, validate, then read the complete correction before continuing.</div><h2>Ready?</h2><button class="primary" onclick="startExam()">Start practice</button></section><section id="exam" class="card hidden"><div class="toolbar"><div class="progress"><span id="bar"></span></div><div id="answered" class="stat"></div><div id="scoreLive" class="stat"></div></div><div id="qmeta" class="qmeta"></div><div id="question" class="question"></div><div id="answers"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prevBtn" class="secondary" onclick="move(-1)">Previous</button><div><button id="checkBtn" class="success" onclick="checkAnswer()">Check answer</button><button id="nextBtn" class="primary" onclick="move(1)">Next</button><button id="finishBtn" class="danger hidden" onclick="finishExam()">Finish</button></div></div></section><section id="result" class="card result hidden"><h2>Practice completed</h2><div id="finalScore" class="score"></div><p id="grade"></p><div class="actions" style="justify-content:center"><button class="primary" onclick="showReview(false)">Full review</button><button class="secondary" onclick="showReview(true)">Review mistakes</button><button class="secondary" onclick="restart()">Restart</button></div></section><section id="review" class="card hidden"><div class="actions"><h2>Detailed review</h2><button class="secondary" onclick="backToResult()">Back</button></div><div id="reviewList"></div></section></div><script>const questions=[
{id:1,type:'single',topic:'Speech',question:`You are building a speech processing solution in Microsoft Foundry for a customer support platform. The platform will transcribe live phone calls, and audio arrives as a continuous stream. You need transcripts to appear within only a few seconds. What should you do?`,options:[`Use text to speech by using a custom neural voice.`,`Use speech translation to generate transcripts into multiple languages.`,`Run a batch transcription job on recorded audio files.`,`Use real-time speech to text to process streaming audio input.`],answer:3,explanation:`Real-time speech to text is designed for continuous streaming audio and low-latency transcription. It returns partial and final hypotheses while the call is still in progress.`,wrong:[`Text to speech performs the opposite conversion.`,`Speech translation is only needed when translation is required.`,`Batch transcription waits for completed audio files.`],concept:`Real-time APIs are selected when the source is a live stream and the result must appear within seconds.`,takeaway:`Live audio + low latency = real-time speech to text.`},
{id:2,type:'single',topic:'Content Understanding',question:`An agent ingests scanned PDF invoices with tables and QR codes. It must preserve layout. Which built-in analyzer should you use?`,options:[`prebuilt-documentFieldSchema`,`prebuilt-read`,`prebuilt-documentSearch`,`prebuilt-layout`],answer:3,explanation:`prebuilt-layout extracts text, paragraphs, tables, selection marks, barcodes, and QR codes while retaining document structure.`,wrong:[`documentFieldSchema targets predefined fields.`,`prebuilt-read primarily returns OCR text.`,`documentSearch targets retrieval.`],concept:`Layout analysis preserves spatial and structural relationships, unlike plain OCR.`,takeaway:`Tables + sections + QR codes = prebuilt-layout.`},
{id:3,type:'multiSelect',topic:'Prompt Shields',question:`Screenshots may contain malicious embedded text. Select the two configurations that prevent prompt injection and treat third-party content as lower trust.`,options:[`Disable the shield.`,`Set action to block.`,`Set action to annotate.`,`Enable Spotlighting.`,`Create a custom blocklist.`,`Use OCR first.`],answer:[1,3],explanation:`Block stops detected document attacks. Spotlighting marks external content as lower trust so it is separated from trusted instructions.`,wrong:[`Annotate detects but allows processing.`,`Blocklists do not understand prompt-injection intent.`,`OCR only extracts the malicious text.`],concept:`This is indirect prompt injection because the instructions are embedded in external content.`,takeaway:`Document Prompt Shields + Block + Spotlighting.`},
{id:4,type:'single',topic:'Foundry Connections',question:`Multiple apps must reuse the same Azure AI Search configuration, avoid keys, and minimize administration. What should you do?`,options:[`Configure HTTP separately per app.`,`Configure an Azure AI Search connection in the Foundry project and reuse it.`,`Call Search directly from every app.`,`Configure managed identity separately for every app.`],answer:1,explanation:`A project connection centralizes endpoint and authentication configuration and can use Microsoft Entra ID.`,wrong:[`Per-app configuration duplicates administration.`,`Direct calls do not provide shared configuration.`,`Separate identities are secure but require more setup.`],concept:`A Foundry connection is a reusable project-level reference to an external resource.`,takeaway:`Shared configuration = project connection.`},
{id:5,type:'single',topic:'Observability',question:`You need the ordered sequence of LLM calls, tool calls, and timing for one agent run. Which capability should you use?`,options:[`Token usage`,`Monitoring`,`Safety metrics`,`Tracing`],answer:3,explanation:`Tracing provides spans for each operation, including order, latency, inputs, outputs, and exceptions.`,wrong:[`Token usage measures consumption.`,`Monitoring provides aggregate metrics.`,`Safety metrics evaluate harmful content.`],concept:`Metrics summarize many executions; traces explain one execution end to end.`,takeaway:`Individual run + timing breakdown = tracing.`},
{id:6,type:'mapping',topic:'Agent Tools',question:`Match each requirement to the correct tool.`,rows:[{label:`Current information from public websites`,options:[`Code interpreter`,`Computer use`,`File search`,`Grounding with Bing Search`],answer:`Grounding with Bing Search`},{label:`Calculations`,options:[`Code interpreter`,`Computer use`,`File search`,`Grounding with Bing Search`],answer:`Code interpreter`},{label:`Documents uploaded directly to the agent`,options:[`Code interpreter`,`Computer use`,`File search`,`Grounding with Bing Search`],answer:`File search`}],explanation:`Bing provides current public web grounding, Code Interpreter performs computation, and File Search retrieves uploaded content.`,concept:`Select tools by capability rather than by model size.`,takeaway:`Web=Bing; calculations=Code Interpreter; uploaded files=File Search.`},
{id:7,type:'single',topic:'OpenAPI Security',question:`An OpenAPI service requires a key in a header and the value is stored in a Foundry connection. What should the specification configure?`,options:[`A header parameter`,`A Key Vault connection`,`An API key security scheme`,`A Bearer token scheme`],answer:2,explanation:`The API key security scheme declares the key location and header name and allows Foundry to bind the connection value.`,wrong:[`A normal parameter does not model authentication.`,`Key Vault does not replace the OpenAPI security definition.`,`Bearer is for OAuth/JWT tokens.`],concept:`OpenAPI securitySchemes standardize authentication behavior for tools.`,takeaway:`Header API key = apiKey security scheme.`},
{id:8,type:'single',topic:'Workflows',question:`Three agents require deterministic steps, conditional branching, shared state, and minimum custom development. What should you use?`,options:[`A workflow`,`Threads and runs`,`A group chat`,`Custom application orchestration`],answer:0,explanation:`A workflow supplies step-based orchestration, conditions, shared variables, and optional branches.`,wrong:[`Threads preserve conversation but do not provide deterministic business branching.`,`Group chat is collaborative.`,`Custom orchestration increases development.`],concept:`Workflows are preferred for predictable business processes.`,takeaway:`Deterministic orchestration = workflow.`},
{id:9,type:'mapping',topic:'Evaluation Gates',question:`Configure the production quality gate.`,rows:[{label:`Comparison`,options:[`Latest approved baseline`,`Previous run`,`Production logs`,`Default branch`],answer:`Latest approved baseline`},{label:`Regression beyond tolerance`,options:[`Continue and alert`,`Fail the workflow`,`Retry automatically`,`Lock branch`],answer:`Fail the workflow`}],explanation:`The approved baseline is the accepted quality reference. Failing the workflow stops deployment automatically.`,concept:`A CI/CD quality gate must be enforceable, not merely informational.`,takeaway:`Approved baseline + failed workflow.`},
{id:10,type:'yesno',topic:'OpenTelemetry',question:`Select Yes or No.`,rows:[{label:`LangChain appears in Traces without a tracer.`,answer:`No`},{label:`Different OTEL_SERVICE_NAME values distinguish services.`,answer:`Yes`},{label:`enable_content_recording=False captures prompts and tool data.`,answer:`No`}],explanation:`LangChain needs tracer callbacks. OTEL_SERVICE_NAME identifies services. Disabling content recording protects sensitive content.`,concept:`OpenTelemetry resource attributes classify the telemetry source.`,takeaway:`Tracer required; service name separates; recording false protects content.`},
{id:11,type:'single',topic:'Image Generation',question:`Generated images must preserve product identity from an input photo. What should you do?`,options:[`Set input_fidelity to high.`,`Apply groundedness detection.`,`Only include a prompt and image.`,`Decrease temperature.`],answer:0,explanation:`High input fidelity increases adherence to the source image’s identity, shape, colors, textures, and branding.`,wrong:[`Groundedness is a text/context evaluation concept.`,`An input image alone does not guarantee fidelity.`,`Temperature controls randomness, not identity preservation.`],concept:`Image-edit parameters target visual preservation more directly than text-generation parameters.`,takeaway:`Preserve source identity = input_fidelity high.`},
{id:12,type:'single',topic:'Memory',question:`Remember airline preferences across conversations but discard card details after the session. Which implementation is correct?`,options:[`Persist both.`,`Persistent memory for preferences and session context for payment data.`,`Conversation history for both.`,`Search for cards and session context for preferences.`],answer:1,explanation:`Preferences are long-lived personalization data. Payment details are sensitive and must remain ephemeral.`,wrong:[`Persisting payment data violates the requirement.`,`History may retain sensitive data and is not the intended long-term preference store.`,`Search is not a payment-data store.`],concept:`Choose storage duration according to data purpose and sensitivity.`,takeaway:`Preferences=persistent memory; sensitive temporary data=session context.`},
{id:13,type:'mapping',topic:'Tool Enforcement',question:`Configure mandatory retrieval and isolated identity.`,rows:[{label:`tool_choice`,options:[`auto`,`required`,`none`],answer:`required`},{label:`Authentication`,options:[`Keys in prompts`,`Shared project identity`,`Distinct agent identity bound to the client application`],answer:`Distinct agent identity bound to the client application`}],explanation:`required forces at least one tool call. A distinct identity isolates permissions and improves auditing.`,concept:`Tool availability and tool enforcement are different settings.`,takeaway:`Mandatory call=required; isolated audit identity=distinct agent identity.`},
{id:14,type:'single',topic:'Agentic RAG',question:`Complex questions need multi-chunk retrieval, multi-turn planning, and parallel searches. Which approach should you use?`,options:[`Iterative retrieval`,`Agentic RAG`,`Chain of thought`,`Classic RAG`],answer:1,explanation:`Agentic RAG plans and decomposes searches using conversation context and can execute multiple retrievals in parallel.`,wrong:[`Iterative retrieval is commonly sequential.`,`Chain of thought is not a retrieval architecture.`,`Classic RAG usually performs one retrieval operation.`],concept:`Agentic retrieval adds planning and orchestration around search.`,takeaway:`Planning + parallel retrieval + conversation context = agentic RAG.`},
{id:15,type:'single',topic:'Content Understanding',question:`Scanned ID cards must return employee ID, name, and expiration date as a structured schema. Which analyzer?`,options:[`prebuilt-layout`,`prebuilt-documentSearch`,`prebuilt-documentFieldSchema`,`prebuilt-read`],answer:2,explanation:`prebuilt-documentFieldSchema is designed to return predefined structured fields.`,wrong:[`Layout preserves structure.`,`DocumentSearch supports retrieval.`,`Read returns raw OCR text.`],concept:`Field extraction is different from layout extraction.`,takeaway:`Named fields + schema = documentFieldSchema.`},
{id:16,type:'mapping',topic:'Tool Choice',question:`Complete the payload to force a tool call.`,rows:[{label:`First blank`,options:[`response_format`,`tool_choice`,`tools`,`type`],answer:`tool_choice`},{label:`Second blank`,options:[`auto`,`required`,`none`,`type`],answer:`required`}],explanation:`tool_choice controls whether the model may, must, or cannot use tools.`,concept:`tools defines available tools; tool_choice controls invocation behavior.`,takeaway:`tool_choice: required.`},
{id:17,type:'single',topic:'Reliability',question:`Calls return HTTP 429 under load. What should you do?`,options:[`Retry immediately in a new thread.`,`Reduce registered tools.`,`Use exponential backoff and jitter.`,`Split files.`],answer:2,explanation:`Backoff reduces request pressure and jitter prevents synchronized retries from many clients.`,wrong:[`A thread does not change quota.`,`Tool count does not resolve throttling.`,`File size is not the main issue in rate limiting.`],concept:`429 indicates throttling or quota exhaustion, not an authentication failure.`,takeaway:`429 = exponential backoff + jitter.`},
{id:18,type:'single',topic:'Connections',question:`Several apps and agents must reuse a model deployment hosted in another Azure resource. What should you recommend?`,options:[`Create a connection to the model resource.`,`Configure a managed private endpoint.`,`Enable RBAC.`,`Configure diagnostics.`],answer:0,explanation:`A connection centralizes endpoint and authentication settings for reuse.`,wrong:[`Private endpoint is networking.`,`RBAC is authorization.`,`Diagnostics is monitoring.`],concept:`Connections solve configuration reuse; private endpoints solve network isolation.`,takeaway:`Reusable external model configuration = connection.`},
{id:19,type:'mapping',topic:'CI/CD Evaluation',question:`Configure a RAG pre-merge quality gate.`,rows:[{label:`Evaluation`,options:[`Fluency`,`Groundedness`,`Similarity`,`Content Safety`],answer:`Groundedness`},{label:`PR policy`,options:[`Retry until passing`,`Notify only`,`Require workflow success before merge`,`Evaluate after deployment`],answer:`Require workflow success before merge`}],explanation:`Groundedness checks support from retrieved documents. Required workflow success prevents weak changes from merging.`,concept:`Evaluation results must be connected to branch protection to become a real gate.`,takeaway:`Groundedness + required successful workflow.`},
{id:20,type:'single',topic:'Image Variation',question:`Generate several stylistic alternatives from a product image while preserving composition, lighting, and subject. Which mode?`,options:[`image_variation`,`mask_inpainting over the whole image`,`text_to_image`,`image_to_image strength 1.0`],answer:0,explanation:`image_variation creates alternatives while preserving key source characteristics.`,wrong:[`Inpainting modifies masked areas.`,`Text-to-image rebuilds from text.`,`Strength 1.0 reduces source influence.`],concept:`Variation changes style broadly; inpainting changes a selected region.`,takeaway:`Whole-image alternatives preserving source = image_variation.`},
{id:21,type:'single',topic:'RAG Ingestion',question:`Scanned PDFs contain multipage tables. Plain-text extraction loses headings, table structure, and page metadata. You need OCR, structure-aware chunks, and page-number metadata. How should you configure ingestion?`,options:[`Use advanced data parsing to reingest the documents.`,`Use OCR and page-level chunking.`,`Store every OCR page as one chunk.`,`Use basic parsing and fixed-size chunking.`],answer:0,explanation:`Advanced data parsing is designed for complex scanned documents. It performs OCR, retains headings and tables, creates structure-aware chunks, and preserves page metadata for precise retrieval.`,wrong:[`Page-level chunking preserves pages but not necessarily table and heading structure.`,`One page per chunk is too coarse for row-level retrieval.`,`Fixed-size chunking breaks structural relationships and loses metadata.`],concept:`For RAG, parsing quality determines retrieval quality. Structure-aware chunks are more useful than arbitrary token windows for complex documents.`,takeaway:`Scanned complex PDFs + tables + metadata = advanced data parsing.`},
{id:22,type:'single',topic:'Agent Tools',question:`An agent must download diagnostic logs from an internal web application that has no API, then analyze the files for bottlenecks. Which tools should you use?`,options:[`Computer use and Code interpreter`,`File search and Microsoft Fabric`,`Grounding with Bing Search and Code interpreter`,`Computer use and File search`],answer:0,explanation:`Computer Use can operate the internal graphical interface and download the files. Code Interpreter can execute Python to parse logs, calculate statistics, find patterns, and visualize bottlenecks.`,wrong:[`File Search retrieves indexed content but does not operate a GUI or perform deep computational analysis.`,`Bing Search targets public web content, not an internal application.`,`Computer Use can download, but File Search is not the best tool for computational log analysis.`],concept:`Use Computer Use when no API exists and the task requires GUI interaction. Use Code Interpreter for deterministic computation and file analysis.`,takeaway:`No API GUI task = Computer Use; analytical processing = Code Interpreter.`},
{id:23,type:'mapping',topic:'Monitoring',question:`An internal Q&A agent shows more “No relevant information found” responses and periodic HTTP 429 errors. Select the monitoring configuration that distinguishes model availability, capacity exhaustion, and inference failures.`,rows:[{label:`Metrics to enable`,options:[`Tokens Cache Match Rate only`,`Total Requests 200 only`,`Model Availability Rate and Provisioned Utilization`,`Time To Response and Total Tokens`],answer:`Model Availability Rate and Provisioned Utilization`},{label:`Diagnostic log`,options:[`AllMetrics`,`audit`,`trace`,`RequestResponse`],answer:`RequestResponse`}],explanation:`Model Availability Rate exposes deployment availability. Provisioned Utilization shows whether allocated capacity is saturated. RequestResponse logs include HTTP status, errors, latency, and failure reasons.`,concept:`Metrics answer “how often/how much”; diagnostic logs answer “what happened in this request.”`,takeaway:`Availability + utilization metrics, then RequestResponse logs for root cause.`},
{id:24,type:'multiSelect',topic:'Distributed Tracing',question:`A Python service outside the Foundry portal invokes an agent. Which two components provide end-to-end latency and exception tracing?`,options:[`Log Analytics workspace`,`Application Insights`,`OpenTelemetry`,`Azure Monitor Agent`,`Microsoft Sentinel`],answer:[1,2],explanation:`OpenTelemetry instruments the Python service and emits distributed spans. Application Insights receives, stores, correlates, and visualizes those traces, dependencies, and exceptions.`,wrong:[`Log Analytics stores/query data but does not instrument application code by itself.`,`Azure Monitor Agent is for host and VM telemetry, not application-level tracing.`,`Sentinel is a SIEM for security analytics.`],concept:`Instrumentation and backend are separate: OpenTelemetry creates telemetry; Application Insights analyzes it.`,takeaway:`Application code tracing = OpenTelemetry + Application Insights.`},
{id:25,type:'single',topic:'Performance',question:`An agent waits for several independent tool calls, increasing response time. The solution must be implemented in application logic. What should you do?`,options:[`Execute independent tool calls in parallel before generating the response.`,`Increase maximum completion tokens.`,`Use a larger model.`,`Enable persistent memory.`],answer:0,explanation:`Independent calls have no data dependency, so running them concurrently reduces total latency from the sum of call durations to approximately the slowest call duration.`,wrong:[`More completion tokens may increase latency.`,`A larger model does not remove tool wait time.`,`Memory affects continuity, not parallel execution.`],concept:`Only parallelize calls that are independent. Dependent calls must remain ordered.`,takeaway:`Independent tools = parallel execution.`},
{id:26,type:'mapping',topic:'Quality and Safety',question:`Match each production issue to the correct observability signal.`,rows:[{label:`Answers unsupported by retrieved documents`,options:[`Latency traces`,`Token analytics`,`Groundedness evaluation metrics`,`Risk and safety metrics`],answer:`Groundedness evaluation metrics`},{label:`Responses flagged for policy violations`,options:[`Latency traces`,`Token analytics`,`Groundedness evaluation metrics`,`Risk and safety metrics`],answer:`Risk and safety metrics`}],explanation:`Groundedness measures whether claims are supported by retrieved context. Risk and safety metrics classify harmful or policy-violating outputs.`,concept:`Quality and safety are separate dimensions and need separate evaluators.`,takeaway:`Unsupported answer=groundedness; policy violation=risk and safety.`},
{id:27,type:'single',topic:'Image Editing',question:`Remove background objects using a mask while preserving original lighting and style. Edits must apply only inside the mask. What should you configure?`,options:[`image_variation with the original image`,`text_to_image`,`image_to_image with high strength`,`mask_inpainting with the input image and a mask`],answer:3,explanation:`Mask inpainting restricts regeneration to the selected region while preserving unmasked pixels, composition, lighting, and style.`,wrong:[`Variation changes the full image.`,`Text-to-image creates a new image.`,`High-strength image-to-image can regenerate areas outside the target.`],concept:`The mask is a spatial constraint. It tells the model exactly where changes are permitted.`,takeaway:`Selective edit inside a region = mask inpainting.`},
{id:28,type:'single',topic:'Azure AI Search',question:`The Search service is reachable and authentication succeeds, but the application says the specified index cannot be found. What must the index property contain?`,options:[`The Search service name`,`The endpoint URL`,`The Azure AI Search index name`,`The Foundry project name`],answer:2,explanation:`The index property identifies the specific index inside the Azure AI Search service. The service endpoint and credentials locate and authenticate to the service, but they do not select an index.`,wrong:[`The service name identifies the service instance.`,`The endpoint identifies the service URL.`,`The Foundry project is unrelated to the Search index identifier.`],concept:`Service, endpoint, and index are different levels: service hosts one or more named indexes.`,takeaway:`index property = exact Azure AI Search index name.`},
{id:29,type:'mapping',topic:'Memory and File Search',question:`Select the Foundry capability for each requirement.`,rows:[{label:`Retain user preferences across multiple conversations`,options:[`Conversation history`,`Persistent agent memory`,`Session context`,`File search`],answer:`Persistent agent memory`},{label:`Allow users to upload documents during chat for grounding`,options:[`Azure AI Search tool`,`Code interpreter`,`File search`,`Persistent agent memory`],answer:`File search`}],explanation:`Persistent memory retains long-term personalization across conversations. File Search indexes and retrieves documents uploaded directly in a conversation.`,concept:`Conversation history preserves a thread; persistent memory preserves selected long-term user facts; File Search provides retrieval over uploaded documents.`,takeaway:`Long-term preferences=memory; user-uploaded grounding=File Search.`},
{id:30,type:'single',topic:'Image Inpainting',question:`Replace only the sky in a landscape with a sunset and preserve all foreground objects. Which configuration should you use?`,options:[`image_variation with the original image`,`mask_inpainting with the original image and a mask covering the sky`,`text_to_image`,`image_to_image with high strength`],answer:1,explanation:`Mask inpainting changes only the masked sky region. The foreground remains outside the mask and is therefore preserved without regeneration.`,wrong:[`Variation affects the image broadly.`,`Text-to-image creates a new landscape.`,`High-strength image-to-image can alter foreground objects.`],concept:`A precise mask provides the strongest control over which pixels can change.`,takeaway:`Replace one selected region while preserving the rest = mask inpainting.`}
];let current=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false),score=0;const total=questions.length;function startExam(){start.classList.add('hidden');exam.classList.remove('hidden');render()}function render(){const q=questions[current];qmeta.textContent=`Question ${q.id}/${total} · ${q.topic}`;question.textContent=q.question;feedback.classList.add('hidden');feedback.innerHTML='';const box=document.getElementById('answers');box.innerHTML='';if(q.type==='single'||q.type==='multiSelect'){q.options.forEach((o,i)=>{const b=document.createElement('button'),sel=q.type==='single'?answers[current]===i:(answers[current]||[]).includes(i);b.className='option'+(sel?' selected':'');if(checked[current]){const good=q.type==='single'?i===q.answer:q.answer.includes(i),chosen=q.type==='single'?answers[current]===i:(answers[current]||[]).includes(i);if(good)b.classList.add('correct');else if(chosen)b.classList.add('wrong')}b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span>`;b.onclick=()=>selectOption(i);box.appendChild(b)})}else q.rows.forEach((r,ri)=>{const row=document.createElement('div');row.className='select-row';const opts=q.type==='yesno'?['','Yes','No']:['',...r.options];row.innerHTML=`<strong>${r.label}</strong><select onchange="setRow(${ri},this.value)" ${checked[current]?'disabled':''}>${opts.map(v=>`<option value="${v}" ${((answers[current]||[])[ri]||'')===v?'selected':''}>${v||'Select...'}</option>`).join('')}</select>`;box.appendChild(row)});if(checked[current])showFeedback();const done=checked.filter(Boolean).length;answered.textContent=`${done}/${total}`;scoreLive.textContent=`Score: ${score}`;bar.style.width=`${done/total*100}%`;prevBtn.disabled=current===0;nextBtn.classList.toggle('hidden',current===total-1);finishBtn.classList.toggle('hidden',current!==total-1);checkBtn.disabled=checked[current]}function selectOption(i){if(checked[current])return;const q=questions[current];if(q.type==='singl
